  muted-foreground: "#97a5cf"
  accent: "#162342"
  accent-foreground: "#edf3ff"
  destructive: "#ff6b88"
  destructive-foreground: "#fff5f8"
  success: "#5ef0b2"
  warning: "#ffb454"
  border: "rgba(125, 149, 255, 0.24)"
