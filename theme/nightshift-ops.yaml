  muted-foreground: "#b3b9cc"
  accent: "#34304a"
  accent-foreground: "#f3f4f9"
  destructive: "#fca5a5"
  destructive-foreground: "#2b1114"
  success: "#86efac"
  warning: "#fcd34d"
  border: "rgba(164, 173, 205, 0.22)"
